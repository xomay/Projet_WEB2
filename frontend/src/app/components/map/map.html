<div class="page"
     (mousemove)="onMouseMove($event)">
  <app-score-circle class="left-header"></app-score-circle>
  <h1>{{title()}}</h1>
  <app-nom-map class="right-header"></app-nom-map>

  <app-undo-redo class="footer-right"></app-undo-redo>
  <app-tile-menu class="left-footer"></app-tile-menu>
  @if (animal !== undefined) {
    <img
      #cursorImg
      src="{{animal?.src}}"
      class="cursor-image"
      alt="Selected Animal"/>
  }
  <div class="map">
    @for (row of currentMap.tiles; track $index; let y = $index) {
      @for (tile of row; track $index; let x = $index) {
        <app-tile-component (click)="changeTile(x,y)" [tile]="tile"></app-tile-component>
      }
    }
  </div>

  @if (status){
    <div class="end-game-overlay">
      <p>Fin de la partie sur : {{ mapName }}</p>
      <p>Score final de {{ playerName }} : {{ finalScore }} points</p>
      <button (click)="returnToMenu()">Retour au menu</button>
    </div>
  }
</div>
