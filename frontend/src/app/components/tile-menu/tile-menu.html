<div class="tile-menu">
  <div (click)="setActiveAnimal(bear)" class="tile-button">
    <p class="tile-number">{{ gameService.availableAnimals().get('bear') }}</p>
    <img src="/bear.svg" alt="Bear">
  </div>
  <div (click)="setActiveAnimal(fish)" class="tile-button">
    <p class="tile-number">{{ gameService.availableAnimals().get('fish') }}</p>
    <img src="/fish.svg" alt="Fish">
  </div>
  <div (click)="setActiveAnimal(fox)" class="tile-button">
    <p class="tile-number">{{ gameService.availableAnimals().get('fox') }}</p>
    <img src="/fox.svg" alt="Fox">
  </div>
</div>
